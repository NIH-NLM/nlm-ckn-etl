name: Build ETL images and push to ECR

# ── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, master, prefect]
    paths:
      - "Dockerfile"
      - "src/main/shell/fetch-entrypoint.sh"
      - "python/pyproject.toml"
      - "python/poetry.lock"
      - "python/src/**"
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: docker build (pipeline + fetcher) → ECR
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Requires secrets/vars:
      #   AWS_ROLE_TO_ASSUME  — IAM role with ECR push permissions for both repos
      #   AWS_REGION          — e.g. us-east-1 (default: us-east-1)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx (for multi-stage cache support)
        uses: docker/setup-buildx-action@v3

      # Build pipeline first so the shared base layers are cached in the
      # local daemon.  The fetcher build reuses those layers at no extra cost.
      - name: Build and push pipeline image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          REPO="nlm-ckn-etl-pipeline"
          IMAGE="${REGISTRY}/${REPO}"

          docker buildx build \
            --platform linux/amd64 \
            --target pipeline \
            --cache-from "type=registry,ref=${IMAGE}:cache" \
            --cache-to   "type=registry,ref=${IMAGE}:cache,mode=max" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${COMMIT_SHA}" \
            --push \
            .

          echo "PIPELINE_IMAGE_URI=${IMAGE}:latest" >> "$GITHUB_ENV"

      - name: Build and push fetcher image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          REPO="nlm-ckn-etl-fetcher"
          IMAGE="${REGISTRY}/${REPO}"

          docker buildx build \
            --platform linux/amd64 \
            --target fetcher \
            --cache-from "type=registry,ref=${IMAGE}:cache" \
            --cache-to   "type=registry,ref=${IMAGE}:cache,mode=max" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${COMMIT_SHA}" \
            --push \
            .

          echo "FETCHER_IMAGE_URI=${IMAGE}:latest" >> "$GITHUB_ENV"

      - name: Write job summary
        if: always()
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PIPELINE_IMAGE="${REGISTRY}/nlm-ckn-etl-pipeline"
          FETCHER_IMAGE="${REGISTRY}/nlm-ckn-etl-fetcher"
          echo "## Docker Image Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Latest tag | Commit tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| pipeline | \`${PIPELINE_IMAGE}:latest\` | \`${PIPELINE_IMAGE}:${COMMIT_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| fetcher  | \`${FETCHER_IMAGE}:latest\`  | \`${FETCHER_IMAGE}:${COMMIT_SHA}\`  |" >> "$GITHUB_STEP_SUMMARY"
